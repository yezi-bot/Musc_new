datasets:
  dataset_name: 'mvtec_ad'  # choice ['mvtec_ad', 'visa']
  data_path:
  class_name: 'toothbrush' #处理类别
  img_resize: 518
  divide_num: 1     #测试集分几份处理，1就是互评策略
models:
  backbone_name1: 'dinov2_vitl14'  #视觉特征提取其
  backbone_name2: 'ViT-L-14-336'    #CLIP的网络结构
  pretrained: 'openai'
  batch_size: 1 
  feature_layers: [5, 11, 17, 23]
  r_list: [1, 3, 5]
  r_list2: [1, 3, 5]
  use_dynamic_model: True
  debug_channel_analysis: True
  dynamic_committee:
    enabled: true
    r: 1
    dino_layer: 23
    position_radius: 1
    channel_distance_quantile: 0.7
    reliability_alpha: 0.5
    ms_quantile: 0.3
    support_quantile: 0.7
    duplicate_similarity: 0.98
    min_cluster_support: 2
    committee_cap: 5
    base_ttl: 5
    max_ttl: 20
    ttl_gap_multiplier: 2.0
  dynamic_fusion:
    mode: fuser
    dino_weight: 1.0
    clip_weight: 0.5
    epsilon: 1.0e-6
device: 0
testing:
  output_dir: 'output'
  vis: True
  vis_type: single_norm # choice ['single_norm', 'whole_norm']
  save_excel: True


# models['backbone_name'] choice:
# ViT-B-32 | ViT-B-16 | ViT-B-16-plus-240
# ViT-L-14 | ViT-L-14-336
# dino_vitbase8 | dino_vitbase16
# dinov2_vitb14 | dinov2_vitl14


# models['pretrained'] choice:
# openai (apply to ViT-B-32, ViT-B-16, ViT-L-14 and ViT-L-14-336)
# laion400m_e31 (apply to ViT-B-32, ViT-B-16, ViT-B-16-plus-240 and ViT-L-14)
# laion400m_e32 (apply to ViT-B-32, ViT-B-16, ViT-B-16-plus-240 and ViT-L-14)
